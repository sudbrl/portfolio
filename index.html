<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEPSE Portfolio Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">NEPSE Portfolio Tracker</h1>
            <button id="refreshBtn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded flex items-center">
                Refresh Market Data
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow">
        <!-- Add Stock Form -->
        <section class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Add Stock to Portfolio</h2>
            <form id="addStockForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="symbol" placeholder="Symbol (e.g., NABIL)" class="border p-2 rounded" required>
                <input type="number" id="quantity" placeholder="Quantity" class="border p-2 rounded" required min="1">
                <input type="number" id="buyPrice" placeholder="Buy Price (NPR)" class="border p-2 rounded" required min="0" step="0.01">
                <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Add Stock</button>
            </form>
        </section>

        <!-- Portfolio Summary -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <h3 class="text-gray-500">Total Investment</h3>
                <p id="totalInvestment" class="text-2xl font-bold text-gray-800">NPR 0.00</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <h3 class="text-gray-500">Current Value</h3>
                <p id="currentValue" class="text-2xl font-bold text-gray-800">NPR 0.00</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <h3 class="text-gray-500">Total P/L</h3>
                <p id="totalPL" class="text-2xl font-bold text-gray-800">NPR 0.00 (0%)</p>
            </div>
        </section>

        <!-- Loading Indicator -->
        <div id="loading" class="flex justify-center my-4 hidden">
            <div class="loader"></div>
        </div>

        <!-- Stocks Table -->
        <section class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="py-3 px-4 text-left">Symbol</th>
                        <th class="py-3 px-4 text-right">Qty</th>
                        <th class="py-3 px-4 text-right">Buy Price</th>
                        <th class="py-3 px-4 text-right">LTP</th>
                        <th class="py-3 px-4 text-right">Current Value</th>
                        <th class="py-3 px-4 text-right">P/L</th>
                        <th class="py-3 px-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="portfolioBody">
                    <!-- Rows will be injected here -->
                </tbody>
            </table>
        </section>
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center mt-6">
        <p>&copy; 2026 NEPSE Portfolio Tracker. Data from Chukul API.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
